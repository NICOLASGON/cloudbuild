<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudBuild App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1e293b; min-height: 100vh; padding: 2rem; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #2563eb; margin-bottom: 0.5rem; }
    .meta { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
    .meta span { background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-family: monospace; }

    .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #334155; }

    form { display: flex; flex-direction: column; gap: 0.75rem; }
    input, textarea { padding: 0.6rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    button { background: #2563eb; color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 8px; font-size: 0.95rem; cursor: pointer; align-self: flex-start; }
    button:hover { background: #1d4ed8; }

    .messages { display: flex; flex-direction: column; gap: 0.75rem; }
    .message { border-bottom: 1px solid #f1f5f9; padding-bottom: 0.75rem; }
    .message:last-child { border-bottom: none; padding-bottom: 0; }
    .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
    .message-author { font-weight: 600; color: #2563eb; }
    .message-date { font-size: 0.8rem; color: #94a3b8; }
    .message-content { color: #475569; line-height: 1.5; }
    .empty { color: #94a3b8; font-style: italic; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CloudBuild App</h1>
    <p class="meta">
      Host: <span>{{ hostname }}</span>
      DB: <span>{{ db_host }}/{{ db_name }}</span>
    </p>

    <div class="card">
      <h2>New message</h2>
      <form method="POST" action="/">
        <input type="text" name="author" placeholder="Your name" required maxlength="100">
        <textarea name="content" placeholder="Your message..." required></textarea>
        <button type="submit">Send</button>
      </form>
    </div>

    <div class="card">
      <h2>Messages ({{ messages|length }})</h2>
      {% if messages %}
      <div class="messages">
        {% for msg in messages %}
        <div class="message">
          <div class="message-header">
            <span class="message-author">{{ msg[1] }}</span>
            <span class="message-date">{{ msg[3].strftime('%Y-%m-%d %H:%M') }}</span>
          </div>
          <p class="message-content">{{ msg[2] }}</p>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="empty">No messages yet. Be the first!</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
